<!--
=====================================================================
LIVE COLLABORATION (համատեղ սլայդների խմբագրում)
Տեղադրում՝ այս ֆայլի <style> և <script> բլոկները կպցրեք index.html-ում՝ </body>-ից առաջ,
«md-studio-js» սկրիպտից հետո։ Նախ կատարեք ՉՈՐՍ փոքր փոփոխությունները «md-slides-js» սկրիպտում.

[A] Գտեք՝  const canEdit=d=>isAdm()||d.owner===me();
    Փոխարինեք՝
    const canEdit=d=>isAdm()||d.owner===me()||!!(d.collab&&d.collab[me()]&&d.collab[me()].status==='accepted');

[B] saveDeckDoc-ում գտեք՝  await bSet(DK(d.id),d);
    Փոխարինեք՝  await (window.MD_COLLAB?MD_COLLAB.save(d):bSet(DK(d.id),d));

[C] pruneImages-ում գտեք՝  if(!d)return;const used=new Set(imgIds(d))
    Փոխարինեք՝  if(!d||(window.MD_COLLAB&&MD_COLLAB.shared(d)))return;const used=new Set(imgIds(d))

[D] Անմիջապես  window.MD_SL={  տողից առաջ ավելացրեք՝
    window.MD_SLX={S:S,drawRail:drawRail,drawStage:drawStage,drawSide:drawSide,repaintStage:repaintStage,snap:snapJSON,updUndo:updUndo,setStatus:setStatus};

FIRESTORE RULES — կարևոր սահմանափակում.
Ծրագիրը չի օգտագործում Firebase Auth (մուտքը Firestore-ի users փաստաթղթով է), ուստի rules-ը չի
կարող իմանալ՝ ո՞վ է գրում։ Իրական սերվերային պաշտպանության համար պետք է անցնել Firebase Auth-ի
(custom token՝ claim u=username) և այդ դեպքում.

  match /databases/{db}/documents/schooldesk/{id} {
    function me(){ return request.auth.token.u; }
    function collabOk(d){ return d.owner==me() || (d.collab!=null && me() in d.collab && d.collab[me()].status=='accepted'); }
    allow read: if request.auth!=null;
    allow create: if request.auth!=null && (!id.matches('deck_.*') || request.resource.data.owner==me());
    allow update, delete: if request.auth!=null &&
      (!id.matches('deck_.*') || collabOk(resource.data) ||
       (me() in resource.data.collab && resource.data.collab[me()].status=='pending'
        && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['collab'])));
  }
Մինչ այդ հասանելիությունը ստուգվում է միայն ծրագրի կոդում (հնարավոր է շրջանցել DevTools-ով)։
=====================================================================
-->

<div id="cb-m"></div>
<script id="cb-js">
(function(){
'use strict';
const X=window.MD_SLX;if(!X||typeof fsdb==='undefined'||!window.MD_SL)return;
const $=id=>document.getElementById(id);
const E=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const clone=o=>JSON.parse(JSON.stringify(o));
const eq=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
const me=()=>CU&&CU.username,adm=()=>CU&&CU.role==='admin';
const col=()=>fsdb.collection(FS_COL),DK=id=>'deck_'+id;
const enc=k=>String(k).replace(/[^A-Za-z0-9]/g,c=>'_'+c.charCodeAt(0).toString(16));
const DEL=()=>firebase.firestore.FieldValue.delete();
const dref=id=>col().doc(DK(id)),ibRef=u=>col().doc('collabinbox_'+enc(u)),pRef=(id,u)=>col().doc('collabp_'+id+'_'+enc(u));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const PAL=['#ef4444','#f59e0b','#10b981','#3b82f6','#8b5cf6','#ec4899','#14b8a6','#f97316'];
const colorOf=u=>{let h=0;for(const c of String(u))h=(h*31+c.charCodeAt(0))|0;return PAL[Math.abs(h)%PAL.length];};
const nameOf=k=>((DB.users||{})[k]||{}).name||k;
const ini=n=>String(n||'?').split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
const canWrite=R=>adm()||R.owner===me()||!!(R.collab&&R.collab[me()]&&R.collab[me()].status==='accepted');

/* ---------- three-way merge (per slide / element / property; nothing is lost) ---------- */
const pick=(b,l,r)=>eq(l,b)?r:l;               // local change wins, otherwise take remote
const idm=a=>Object.fromEntries((a||[]).map(x=>[x.id,x]));
function mlist(B,L,R,mi){
  const mb=idm(B),ml=idm(L),mr=idm(R),out={};
  new Set([...Object.keys(ml),...Object.keys(mr)]).forEach(id=>{
    const b=mb[id],l=ml[id],r=mr[id];
    if(l&&r)out[id]=mi(b||{},l,r);
    else if(l)out[id]=(!b||!eq(l,b))?l:null;      // deleted remotely & untouched locally -> removed
    else out[id]=(!b||!eq(r,b))?r:null;           // deleted locally & untouched remotely -> removed
  });
  const ids=a=>a.map(x=>x.id),lo=ids(L),ro=ids(R);
  const reord=!eq(lo.filter(i=>mb[i]),ids(B).filter(i=>ml[i]));
  const pri=reord?lo:ro,oth=reord?ro:lo,order=pri.filter(i=>out[i]);
  oth.forEach((i,k)=>{if(out[i]&&order.indexOf(i)<0){let p=k-1;while(p>=0&&order.indexOf(oth[p])<0)p--;order.splice(p>=0?order.indexOf(oth[p])+1:0,0,i);}});
  Object.keys(out).forEach(i=>{if(out[i]&&order.indexOf(i)<0)order.push(i);});
  return order.map(i=>out[i]);
}
const mel=(b,l,r)=>{const m={};new Set([...Object.keys(l),...Object.keys(r)]).forEach(k=>{m[k]=pick(b[k],l[k],r[k]);});return m;};
const msl=(b,l,r)=>{const m={};new Set([...Object.keys(l),...Object.keys(r)]).forEach(k=>{if(k!=='els')m[k]=pick(b[k],l[k],r[k]);});m.els=mlist(b.els,l.els,r.els,mel);return m;};
function merge(B,L,R){
  const M={};
  new Set([...Object.keys(L),...Object.keys(R)]).forEach(k=>{
    if(k==='slides'||k==='imgs'||k==='collab')return;
    if(k==='owner'||k==='ownerName'||k==='created'||k==='id'){M[k]=R[k]!==undefined?R[k]:L[k];return;}
    if(k==='classes'&&R.owner!==me()&&!adm()){M[k]=R[k];return;}   // only the owner changes class sharing
    M[k]=pick(B[k],L[k],R[k]);
  });
  M.collab=R.collab||{};
  M.imgs=[...new Set([...(R.imgs||[]),...(L.imgs||[])])];
  M.slides=mlist(B.slides,L.slides,R.slides,msl);
  return M;
}
const core=o=>{const c=Object.assign({},o);delete c.updated;return c;};

/* ---------- state ---------- */
const bases={};let pendingR=null,need=null,ptrDown=false;
const P={id:null,un:null,dun:null,docs:{},sig:'',ts:0,cx:null,cy:null,n:0};
const busyUI=()=>{const a=document.activeElement;return ptrDown||!!(a&&a.isContentEditable);};
const typing=()=>{const a=document.activeElement,ed=$('sl-ed');return !!(a&&ed&&ed.contains(a)&&(/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)||a.isContentEditable));};
const selSlideId=()=>{const S=X.S,s=S.deck&&S.deck.slides[S.sel];return s&&s.id;};
function applyInto(d,M,sid){
  Object.keys(d).forEach(k=>{if(!(k in M))delete d[k];});Object.assign(d,M);
  const S=X.S,i=d.slides.findIndex(s=>s.id===sid);S.sel=i>=0?i:Math.max(0,Math.min(S.sel,d.slides.length-1));
}
function flushRedraw(){
  if(!need||busyUI())return;
  const S=X.S;if(!S.deck)return;need=null;
  const sl=S.deck.slides[S.sel];if(S.eid&&!(sl&&(sl.els||[]).some(e=>e.id===S.eid)))S.eid=null;
  X.drawRail();X.drawStage();if(!typing())X.drawSide();
  S.hist=[X.snap()];S.hi=0;X.updUndo();      // undo never reverts a collaborator's work
}
function tryApply(){
  if(!pendingR||busyUI())return;
  const R=pendingR,d=X.S.deck;pendingR=null;
  if(!d||d.id!==R.id)return;
  const B=bases[d.id];if(!B){bases[d.id]=clone(R);return;}
  if(eq(core(R),core(B)))return;
  const M=merge(B,d,R),ch=!eq(core(M),core(d));
  if(ch){applyInto(d,M,selSlideId());need=true;}
  bases[d.id]=clone(R);
}
/* ---------- save (called by saveDeckDoc) ---------- */
async function save(d){
  for(let i=0;i<60&&busyUI();i++)await sleep(100);
  const ref=dref(d.id),L=clone(d);let M=null;
  await fsdb.runTransaction(async tx=>{
    const sn=await tx.get(ref),R=sn.exists?sn.data():null;
    if(!R||!R.slides||R.deleted){M=null;tx.set(ref,fsClean(L));return;}
    if(!canWrite(R))throw new Error('perm');
    const B=bases[d.id];
    M=B?merge(B,L,R):Object.assign({},L,{collab:R.collab||{},owner:R.owner,ownerName:R.ownerName});
    tx.set(ref,fsClean(M));
  });
  if(!M){bases[d.id]=clone(L);return;}
  const res=merge(L,d,M);                         // keep edits typed while the save was in flight
  if(!eq(core(res),core(d))){applyInto(d,res,selSlideId());need=true;}
  bases[d.id]=clone(M);
}
const shared=d=>!!d&&(Object.keys(d.collab||{}).length>0||(d.owner&&d.owner!==me()&&!adm()));
window.MD_COLLAB={save:save,shared:shared};

/* ---------- presence + live deck listener ---------- */
function kick(){
  const S=X.S;S.dirty=false;S.deck=null;$('sl-ed').classList.remove('on');document.body.style.overflow='';detach();
  alert('Սլայդի սեփականատերը դադարեցրել է Ձեր համատեղ հասանելիությունը։');if(window.slReload)slReload();
}
function attach(id){
  if(P.id===id)return;detach();P.id=id;P.docs={};P.sig='';
  P.un=col().where('deckId','==',id).onSnapshot(qs=>{qs.docChanges().forEach(c=>{const x=c.doc.data();if(x.kind!=='cbp')return;if(c.type==='removed')delete P.docs[x.u];else P.docs[x.u]=x;});drawPres();},()=>{});
  P.dun=dref(id).onSnapshot(sn=>{
    if(!sn.exists||(sn.metadata&&sn.metadata.hasPendingWrites))return;
    const R=sn.data(),d=X.S.deck;if(!d||d.id!==id)return;
    if(!canWrite(R)){kick();return;}
    pendingR=R;tryApply();
  },()=>{});
  sendP(true);
}
function detach(){
  if(!P.id)return;const id=P.id;
  [P.un,P.dun].forEach(f=>{try{f&&f();}catch(e){}});P.un=P.dun=null;P.id=null;P.docs={};pendingR=null;
  try{pRef(id,me()).delete();}catch(e){}
  const o=$('cb-ov');if(o)o.remove();drawPres();
}
function sendP(force){
  const S=X.S,d=S.deck;if(!d||P.id!==d.id||!CU)return;
  const sl=d.slides[S.sel]||{},now=Date.now();
  const o={kind:'cbp',deckId:d.id,u:me(),name:CU.name||me(),color:colorOf(me()),ts:now,slide:sl.id||'',eid:S.eid||'',x:P.cx==null?-1:Math.round(P.cx*10)/10,y:P.cy==null?-1:Math.round(P.cy*10)/10};
  const sig=[o.slide,o.eid,o.x,o.y].join('|');
  if(!force&&sig===P.sig&&now-P.ts<10000)return;
  P.sig=sig;P.ts=now;pRef(d.id,me()).set(o).catch(()=>{});
}
const online=()=>Object.values(P.docs).filter(x=>x.u!==me()&&Date.now()-x.ts<30000);
function drawPres(){
  const el=$('cb-pres');if(!el)return;
  const o=P.id?online():[];
  el.innerHTML=o.slice(0,5).map(x=>'<span class="cb-av" style="background:'+E(x.color)+'" title="'+E(x.name)+' · առցանց">'+E(ini(x.name))+'</span>').join('')
    +(o.length>5?'<span class="cb-av" style="background:#64748b">+'+(o.length-5)+'</span>':'')
    +(navigator.onLine?'':'<span class="cb-off">Անցանց</span>');
}
function overlay(){
  const box=document.querySelector('#sl-stage .sl-box'),S=X.S;let ov=$('cb-ov');
  if(!box||!S.deck){if(ov)ov.remove();return;}
  const sl=S.deck.slides[S.sel]||{},list=online().filter(x=>x.slide===sl.id);
  const sig=sl.id+JSON.stringify(list.map(x=>[x.u,x.x,x.y,x.eid]))+JSON.stringify((sl.els||[]).map(e=>[e.id,e.x,e.y,e.w,e.h,e.rot]));
  if(ov&&ov.parentNode===box&&ov.dataset.sig===sig)return;
  if(!ov){ov=document.createElement('div');ov.id='cb-ov';}
  ov.dataset.sig=sig;
  ov.innerHTML=list.map(x=>{
    let h='',e=x.eid&&(sl.els||[]).find(z=>z.id===x.eid);
    if(e)h+='<div class="cb-sel" style="left:'+e.x+'%;top:'+e.y+'%;width:'+e.w+'%;height:'+e.h+'%;border-color:'+E(x.color)+';transform:rotate('+(e.rot||0)+'deg)"><span style="background:'+E(x.color)+'">'+E(x.name)+'</span></div>';
    if(x.x>=0)h+='<div class="cb-cur" style="left:'+x.x+'%;top:'+x.y+'%"><svg viewBox="0 0 24 24"><path d="M3 2l7 19 2.5-8L21 10z" fill="'+E(x.color)+'" stroke="#fff" stroke-width="1.5"/></svg><span style="background:'+E(x.color)+'">'+E(x.name)+'</span></div>';
    return h;}).join('');
  if(ov.parentNode!==box)box.appendChild(ov);
}
document.addEventListener('pointerdown',e=>{if(e.target.closest&&e.target.closest('#sl-ed'))ptrDown=true;},true);
['pointerup','pointercancel'].forEach(t=>window.addEventListener(t,()=>{ptrDown=false;},true));
document.addEventListener('pointermove',e=>{
  const b=e.target.closest&&e.target.closest('#sl-stage .sl-box');
  if(!b){P.cx=null;return;}
  const r=b.getBoundingClientRect();P.cx=(e.clientX-r.left)/r.width*100;P.cy=(e.clientY-r.top)/r.height*100;
},true);
setInterval(()=>{
  try{
    watchInbox();
    if(!P.id)return;
    tryApply();flushRedraw();overlay();drawPres();
    if(++P.n%2===0){sendP(false);const S=X.S;if(S.deck&&S.dirty&&!S.saving&&!busyUI())window.slSave(false);}  // fast autosave while shared
  }catch(e){console.warn('collab',e);}
},250);

/* ---------- editor hooks ---------- */
const _edit=window.slEdit;
window.slEdit=async function(id){
  await _edit.apply(this,arguments);
  const d=X.S.deck;if(!d||d.id!==id)return;
  bases[id]=clone(d);if(shared(d))attach(id);
};
const _close=window.slClose;
window.slClose=async function(){
  const r=await _close.apply(this,arguments);
  if(!X.S.deck||!$('sl-ed').classList.contains('on'))detach();return r;
};
function inject(){
  const top=document.querySelector('#sl-ed .sl-top');if(!top||$('cb-btn'))return;
  const old=[...top.querySelectorAll('button')].find(b=>(b.getAttribute('onclick')||'')==='slShare()');
  if(old)old.textContent='Դասարաններ';
  const pres=document.createElement('span');pres.id='cb-pres';
  const b=document.createElement('button');b.id='cb-btn';b.className='cb-share';
  b.innerHTML='<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M17 8h5M19.5 5.5v5"/></svg>Կիսվել';
  b.onclick=()=>window.cbShare();
  const anchor=old||top.lastChild;top.insertBefore(pres,anchor);top.insertBefore(b,anchor);drawPres();
}
new MutationObserver(inject).observe($('sl-ed'),{childList:true});

/* ---------- invites / inbox ---------- */
const ib={u:null,un:null,d:{items:{},evts:{},out:{}}};
const EV={invite:['Քեզ հետ կիսվել են սլայդով','-ը հրավիրել է քեզ խմբագրել «{t}» սլայդը'],accepted:['Հրավերն ընդունվեց','-ը ընդունեց «{t}» սլայդի հրավերը'],declined:['Հրավերը մերժվեց','-ը մերժեց «{t}» սլայդի հրավերը'],revoked:['Հասանելիությունը դադարեցվեց','Համատեղ հասանելիությունը «{t}» սլայդին դադարեցվել է']};
function watchInbox(){
  const u=me()||null;if(u===ib.u)return;
  if(ib.un){ib.un();ib.un=null;}ib.u=u;ib.d={items:{},evts:{},out:{}};badge();if(!u)return;
  ib.un=ibRef(u).onSnapshot(sn=>{
    const d=sn.exists?sn.data():{};ib.d={items:d.items||{},evts:d.evts||{},out:d.out||{}};
    notify();badge();if(($('collab')||{}).classList&&$('collab').classList.contains('on'))renderPage();
  },()=>{});
}
function notify(){
  const key='cb_seen_'+me();let seen=[];try{seen=JSON.parse(localStorage.getItem(key)||'[]');}catch(e){}
  Object.entries(ib.d.evts).sort((a,b)=>a[1].ts-b[1].ts).forEach(([id,e])=>{
    if(seen.indexOf(id)>=0||Date.now()-e.ts>7*864e5||!EV[e.type])return;seen.push(id);
    const m=EV[e.type];addNotif('🤝',m[0],(e.type==='revoked'?'':nameOf(e.who))+m[1].replace('{t}',e.title||''),()=>showPg('collab'));
  });
  try{localStorage.setItem(key,JSON.stringify(seen.slice(-80)));}catch(e){}
}
const pendingN=()=>Object.values(ib.d.items).filter(x=>x.status==='pending').length;
function badge(){const b=$('cb-bd');if(b)b.textContent=pendingN()||'';}
const evt=(type,deckId,title,who)=>({['e'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)]:{type:type,deckId:deckId,title:title,who:who||me(),ts:Date.now()}});

async function invite(deckId,userKey){
  const u=(DB.users||{})[userKey];if(!u)throw new Error('nouser');let title='';
  await fsdb.runTransaction(async tx=>{
    const sn=await tx.get(dref(deckId)),R=sn.data();
    if(R.owner!==me()&&!adm())throw new Error('owner');
    const c=Object.assign({},R.collab||{});
    if(c[userKey]&&c[userKey].status!=='declined')throw new Error('dup');
    c[userKey]={status:'pending',name:u.name||userKey,by:me(),ts:Date.now()};title=R.title;
    tx.update(dref(deckId),{collab:c});
  });
  await ibRef(userKey).set({items:{[deckId]:{deckId:deckId,title:title,from:me(),fromName:CU.name||me(),ts:Date.now(),status:'pending'}},evts:evt('invite',deckId,title)},{merge:true});
  await ibRef(me()).set({out:{[deckId]:{title:title}}},{merge:true});
}
async function respond(deckId,ok){
  let owner='',title='';
  await fsdb.runTransaction(async tx=>{
    const sn=await tx.get(dref(deckId));if(!sn.exists)throw new Error('gone');const R=sn.data(),c=Object.assign({},R.collab||{});
    if(!c[me()]||c[me()].status!=='pending')throw new Error('state');
    c[me()]=Object.assign({},c[me()],{status:ok?'accepted':'declined',ts:Date.now()});owner=R.owner;title=R.title;
    tx.update(dref(deckId),{collab:c});
  });
  await ibRef(me()).set({items:{[deckId]:{status:ok?'accepted':'declined'}}},{merge:true});
  await ibRef(owner).set({evts:evt(ok?'accepted':'declined',deckId,title)},{merge:true});
}
async function revoke(deckId,userKey){      // userKey=null -> stop all sharing
  let gone=[],title='';
  await fsdb.runTransaction(async tx=>{
    const sn=await tx.get(dref(deckId)),R=sn.data();if(R.owner!==me()&&!adm())throw new Error('owner');
    const c=Object.assign({},R.collab||{});title=R.title;
    if(userKey){delete c[userKey];gone=[userKey];}else{gone=Object.keys(c);Object.keys(c).forEach(k=>delete c[k]);}
    tx.update(dref(deckId),{collab:c});
  });
  for(const u of gone)await ibRef(u).set({items:{[deckId]:DEL()},evts:evt('revoked',deckId,title)},{merge:true});
  const R=(await dref(deckId).get()).data();
  if(!Object.keys((R&&R.collab)||{}).length)await ibRef(R.owner).set({out:{[deckId]:DEL()}},{merge:true});
}
const ERR={dup:'Այս օգտատերն արդեն հրավիրված է։',owner:'Միայն սեփականատերը կարող է կառավարել հասանելիությունը։',nouser:'Օգտատերը չի գտնվել։',gone:'Սլայդը չի գտնվել։',state:'Հրավերն արդեն մշակված է։'};
const emsg=e=>ERR[e&&e.message]||'Չհաջողվեց․ ստուգեք կապը և փորձեք կրկին։';

/* ---------- share modal (inside the editor) ---------- */
let SM={id:null,q:'',R:null};
window.cbShare=async function(){
  const S=X.S;if(!S.deck)return;
  const ok=await window.slSave(true);if(ok===false){alert('Սլայդը դեռ պահպանվում է, փորձեք մի պահ անց։');return;}
  SM={id:S.deck.id,q:'',R:null};await shareLoad();
  const m=$('cb-m');m.classList.add('on');shareDraw();
};
async function shareLoad(){SM.R=(await dref(SM.id).get()).data()||{};}
function shareDraw(){
  const m=$('cb-m'),R=SM.R||{},c=R.collab||{},owner=R.owner===me()||adm(),q=SM.q.trim().toLowerCase();
  let cand='';
  if(owner&&q){
    const L=Object.entries(DB.users||{}).filter(([k,v])=>k!==me()&&v&&v.role&&v.role!=='admin'&&[v.name,k,v.login,v.email,getPersonalCode(k)].join(' ').toLowerCase().indexOf(q)>=0).slice(0,25);
    cand=L.length?L.map(([k,v])=>'<div class="cb-row"><span class="cb-av" style="background:'+colorOf(k)+';margin:0">'+E(ini(v.name))+'</span><div class="t"><b>'+E(v.name||k)+'</b><i>'+E(v.login||k)+' · կոդ '+E(getPersonalCode(k))+'</i></div>'
      +(c[k]&&c[k].status!=='declined'?'<span class="cb-st">'+(c[k].status==='accepted'?'Ընդունված':'Սպասում է')+'</span>':'<button class="cb-b p" data-a="inv" data-u="'+E(k)+'">Հրավիրել</button>')+'</div>').join(''):'<div class="cb-row">Ոչ ոք չի գտնվել։</div>';
  }
  const cur=Object.entries(c).map(([k,v])=>{const p=P.docs[k],on=p&&Date.now()-p.ts<30000;
    return '<div class="cb-row"><span class="cb-av" style="background:'+colorOf(k)+';margin:0">'+E(ini(v.name))+'</span><div class="t"><b>'+E(v.name||k)+'</b><i><span class="cb-dot'+(on?' on':'')+'"></span>'+(v.status==='accepted'?(on?'Առցանց':'Անցանց'):v.status==='pending'?'Հրավերը սպասում է':'Մերժել է')+'</i></div>'
      +(owner?'<button class="cb-b d" data-a="rev" data-u="'+E(k)+'">Հեռացնել</button>':'')+'</div>';}).join('');
  m.innerHTML='<div class="cb-box"><h3>Համատեղ խմբագրում</h3><p class="s">Հրավիրված օգտատերերը կխմբագրեն նույն սլայդը՝ իրական ժամանակում։</p>'
    +(owner?'<input class="cb-in" id="cb-q" placeholder="Որոնել անունով, օգտանունով կամ եզակի կոդով..." value="'+E(SM.q)+'" autocomplete="off">'+cand:'')
    +'<div style="font-weight:800;margin:14px 0 4px">Մասնակիցներ</div>'+(cur||'<div class="cb-row" style="color:var(--txt2)">Դեռ ոչ ոք չի հրավիրված։</div>')
    +'<div id="cb-err" style="color:var(--red);font-size:12px;min-height:16px;margin-top:6px"></div><div style="display:flex;gap:8px;justify-content:space-between;margin-top:8px;flex-wrap:wrap">'
    +(owner&&cur?'<button class="cb-b d" data-a="stop">Դադարեցնել համատեղ հասանելիությունը</button>':'<span></span>')+'<button class="cb-b" data-a="x">Փակել</button></div></div>';
  const i=$('cb-q');if(i&&SM.focus){i.focus();i.setSelectionRange(i.value.length,i.value.length);}
}
$('cb-m').addEventListener('input',e=>{if(e.target.id==='cb-q'){SM.q=e.target.value;SM.focus=1;shareDraw();}});
$('cb-m').addEventListener('mousedown',e=>{if(e.target.id==='cb-m')$('cb-m').classList.remove('on');});
$('cb-m').addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,u=b.dataset.u;
  try{
    if(a==='x'){$('cb-m').classList.remove('on');return;}
    b.disabled=true;
    if(a==='inv'){await invite(SM.id,u);attach(SM.id);}
    if(a==='rev'){await revoke(SM.id,u);}
    if(a==='stop'){if(!confirm('Դադարեցնե՞լ հասանելիությունը բոլորի համար։'))return;await revoke(SM.id,null);}
    SM.focus=0;await shareLoad();shareDraw();
  }catch(er){console.error(er);const x=$('cb-err');if(x)x.textContent=emsg(er);b.disabled=false;}
});

/* ---------- «Համատեղ խմբագրում» page: invitations / shared with me / shared by me ---------- */
function ensureUI(){
  if(!CU)return;const nav=$('nav'),mn=$('mn');if(!nav||!mn)return;
  if(!mn.querySelector('#collab'))mn.insertAdjacentHTML('beforeend','<div class="pg" id="collab"></div>');
  if(!nav.querySelector('[data-p="collab"]')){
    const it=document.createElement('div');it.className='ni';it.setAttribute('data-p','collab');it.setAttribute('onclick',"showPg('collab')");
    it.innerHTML='🤝 Համատեղ խմբագրում <span class="pb" id="cb-bd"></span>';
    const a=nav.querySelector('[data-p="slides"]');
    if(a)a.parentNode.insertBefore(it,a.nextSibling);else nav.appendChild(it);badge();
  }
}
let busy=false;['nav','mn'].forEach(id=>{const e=$(id);if(e)new MutationObserver(()=>{if(busy)return;busy=true;setTimeout(()=>{busy=false;try{ensureUI();}catch(e){}},0);}).observe(e,{childList:true});});
const _sp=window.showPg;
window.showPg=function(id){
  const r=_sp.apply(this,arguments);
  if(id==='collab'){ensureUI();const pg=$('collab');if(pg){document.querySelectorAll('.pg').forEach(p=>p.classList.remove('on'));pg.classList.add('on');document.querySelectorAll('.ni').forEach(n=>n.classList.toggle('on',n.getAttribute('data-p')==='collab'));renderPage();}}
  return r;
};
function renderPage(){
  const el=$('collab');if(!el||!CU)return;
  const it=Object.values(ib.d.items),pend=it.filter(x=>x.status==='pending'),acc=it.filter(x=>x.status==='accepted'),out=Object.keys(ib.d.out);
  const card=(x,btns)=>'<div class="cb-card"><div class="cb-row" style="border:0"><span class="cb-av" style="background:'+colorOf(x.from)+';margin:0">'+E(ini(x.fromName))+'</span><div class="t"><b>'+E(x.title)+'</b><i>'+E(x.fromName||'')+'-ը կիսվել է Ձեզ հետ</i></div>'+btns+'</div></div>';
  el.innerHTML='<div class="pt">🤝 Համատեղ խմբագրում</div><div class="ps">Սլայդներ, որոնք խմբագրվում են մի քանի օգտատերերի կողմից՝ իրական ժամանակում</div>'
   +'<h3 style="margin:14px 0 8px">Հրավերներ'+(pend.length?' ('+pend.length+')':'')+'</h3>'
   +(pend.length?pend.map(x=>card(x,'<button class="cb-b p" data-a="acc" data-d="'+E(x.deckId)+'">Ընդունել</button><button class="cb-b d" data-a="dec" data-d="'+E(x.deckId)+'">Մերժել</button>')).join(''):'<div class="cb-card" style="color:var(--txt2)">Նոր հրավերներ չկան։</div>')
   +'<h3 style="margin:18px 0 8px">Քեզ հետ կիսված սլայդներ</h3>'
   +(acc.length?acc.map(x=>card(x,'<button class="cb-b p" data-a="open" data-d="'+E(x.deckId)+'">Բացել ու խմբագրել</button>')).join(''):'<div class="cb-card" style="color:var(--txt2)">Դեռ կիսված սլայդներ չկան։</div>')
   +'<h3 style="margin:18px 0 8px">Ես կիսել եմ</h3><div id="cb-out">'+(out.length?'Բեռնվում է...':'<div class="cb-card" style="color:var(--txt2)">Դուք դեռ ոչ մեկի հետ չեք կիսվել։</div>')+'</div>';
  out.length&&Promise.all(out.map(id=>dref(id).get().then(s=>s.exists?Object.assign({id:id},s.data()):null).catch(()=>null))).then(L=>{
    const o=$('cb-out');if(!o)return;L=L.filter(d=>d&&Object.keys(d.collab||{}).length);
    o.innerHTML=L.length?L.map(d=>'<div class="cb-card"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b style="flex:1">'+E(d.title)+'</b><button class="cb-b p" data-a="open" data-d="'+E(d.id)+'">Բացել</button><button class="cb-b d" data-a="stopd" data-d="'+E(d.id)+'">Դադարեցնել հասանելիությունը</button></div>'
      +Object.entries(d.collab).map(([k,v])=>'<div class="cb-row"><div class="t"><b>'+E(v.name||k)+'</b><i>'+(v.status==='accepted'?'Ընդունված':v.status==='pending'?'Սպասում է':'Մերժված')+'</i></div></div>').join('')+'</div>').join(''):'<div class="cb-card" style="color:var(--txt2)">Ակտիվ համատեղ սլայդներ չկան։</div>';
  });
}
document.addEventListener('click',async e=>{
  const b=e.target.closest&&e.target.closest('#collab [data-a]');if(!b)return;const a=b.dataset.a,d=b.dataset.d;
  try{
    if(a==='open'){window.slEdit(d);return;}
    b.disabled=true;
    if(a==='acc')await respond(d,true);if(a==='dec')await respond(d,false);
    if(a==='stopd'){if(!confirm('Դադարեցնե՞լ համատեղ հասանելիությունը։'))return;await revoke(d,null);}
    renderPage();
  }catch(er){console.error(er);alert(emsg(er));b.disabled=false;}
});
