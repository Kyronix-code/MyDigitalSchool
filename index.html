<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Կայքը գտնվում է տեխնիկական սպասարկման փուլում</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Armenian", Arial, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    .container {
      max-width: 560px;
      background: #ffffff;
      padding: 48px 36px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
    }
    .icon {
      font-size: 48px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 16px;
      color: #0f172a;
      line-height: 1.3;
    }
    p {
      font-size: 16px;
      line-height: 1.6;
      color: #475569;
      margin-bottom: 24px;
    }
    .contact {
      font-size: 14px;
      color: #64748b;
    }
    .contact a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 500;
    }
    .contact a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🛠️</div>
    <h1>Կայքը գտնվում է տեխնիկական սպասարկման փուլում</h1>
    <p>
      Ներկայումս կայքում իրականացվում են տեխնիկական աշխատանքներ և թարմացումներ։ 
      Հայցում ենք Ձեր ներողամտությունը պատճառված անհարմարության համար։ Խնդրում ենք փորձել մի փոքր ուշ։
    </p>
    <div class="contact">
      Հարցերի դեպքում կարող եք կապ հաստատել մեզ հետ՝ 
      <a href="mailto:info@example.am">info@example.am</a>
    </div>
  </div>
</body>
</html>
