
<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Տեխնիկական աշխատանքներ</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #080d18;
    color: white;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 600px;
    text-align: center;
    padding: 55px 30px;
    background: #111827;
    border: 1px solid #263449;
    border-radius: 20px;
    box-shadow: 0 20px 60px #0008;
}

.icon {
    width: 85px;
    height: 85px;
    margin: 0 auto 30px;
    border-radius: 50%;
    background: #1e293b;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 38px;
    animation: rotate 5s linear infinite;
}

@keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

h1 {
    font-size: clamp(25px, 5vw, 36px);
    margin-bottom: 18px;
}

p {
    color: #aab5c5;
    font-size: 16px;
    line-height: 1.9;
}

.line {
    width: 55px;
    height: 3px;
    background: #3b82f6;
    margin: 25px auto;
    border-radius: 10px;
}

.status {
    display: inline-block;
    padding: 11px 20px;
    border-radius: 30px;
    background: #172b46;
    color: #60a5fa;
    font-size: 14px;
    margin-top: 10px;
}

.footer {
    margin-top: 35px;
    color: #64748b;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="container">

    <div class="icon">⚙️</div>

    <h1>Մենք շուտով կվերադառնանք</h1>

    <div class="line"></div>

    <p>
        Կայքում այս պահին կատարվում են
        տեխնիկական աշխատանքներ։
        Մենք աշխատում ենք, որպեսզի
        հնարավորինս շուտ վերականգնենք
        կայքի բնականոն աշխատանքը։
    </p>

    <div class="status">
        ● Տեխնիկական աշխատանքներ
    </div>

    <div class="footer">
        Շնորհակալություն համբերության համար։
    </div>

</div>

</body>
</html>
