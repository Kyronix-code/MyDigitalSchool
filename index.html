<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Տեխնիկական սպասարկում</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .container {
            max-width: 600px;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }
        .icon {
            font-size: 64px;
            margin-bottom: 20px;
            color: #3498db;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 15px;
            color: #2c3e50;
        }
        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #7f8c8d;
            margin-bottom: 25px;
        }
        .footer {
            font-size: 0.9rem;
            color: #bdc3c7;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Կայքի պատկերակ (Emoji) -->
        <div class="icon">🛠️</div>
        
        <!-- Գլխավոր վերնագիր -->
        <h1>Կայքը գտնվում է տեխնիկական սպասարկման մեջ</h1>
        
        <!-- Հաղորդագրություն օգտատիրոջը -->
        <p>
            Հարգելի՛ այցելու, մեր կայքում այժմ իրականացվում են պլանային թարմացման և բարելավման աշխատանքներ։ 
            Մենք շատ շուտով կվերադառնանք։ Հայցում ենք ձեր ներողամտությունը պատճառված անհանգստության համար։
        </p>
        
        <!-- Ստորոտ -->
        <div class="footer">
            &copy; 2026 Բոլոր իրավունքները պաշտպանված են:
        </div>
    </div>

</body>
</html>
